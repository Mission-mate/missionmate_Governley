# Supabase CLI settings. Used by `supabase db push`, `supabase functions deploy` and `supabase start`.
project_id = "governley"

[api]
# Rows per request. The app reads in pages of 1000, so keep this at 1000 or higher.
max_rows = 1000

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]
enable_signup = true

[auth.email]
enable_confirmations = true
# Sign-up email shows a 6-digit code (the Register page asks for it).
otp_length = 6

# Microsoft Entra ID (Azure AD). For the hosted project, set these in the dashboard instead
# (Authentication -> Sign In / Providers -> Azure).
[auth.external.azure]
enabled = false
client_id = "env(AZURE_CLIENT_ID)"
secret = "env(AZURE_CLIENT_SECRET)"
url = "env(AZURE_TENANT_URL)"
redirect_uri = ""

[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = ""

# Edge functions check the caller themselves (signed-in user, or the scheduled-job secret),
# so the gateway JWT check is turned off. This also lets them work with the new API keys.
# Function names are lowercase with hyphens: Supabase lowercases names, so camelCase folders fail to deploy.
# The app still calls them by their Base44 names (invoke('deleteMeeting')); functionSlug.js converts.

[functions.admin-users]
verify_jwt = false

[functions.calendar-status]
verify_jwt = false

